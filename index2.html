<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Wheel">
<meta name="theme-color" content="#14140f">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wheel of life tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @font-face {
    font-family: 'ui-serif-fallback';
    src: local('Georgia');
  }
  :root {
    --bg: #14140f;
    --surface: #1d1d17;
    --surface-raised: #24241d;
    --line: #34342b;
    --ink: #f2f0e6;
    --ink-soft: #b8b6a8;
    --ink-muted: #7d7b6e;
    --sat: #6fbf73;
    --imp: #e0a45f;
    --accent: #d4c360;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    overscroll-behavior-y: none;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: var(--ink);
    padding: calc(20px + var(--safe-top)) 18px calc(48px + var(--safe-bottom));
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 26px;
    font-weight: 400;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
    position: sticky;
    top: calc(8px + var(--safe-top));
    z-index: 10;
    border: 1px solid var(--line);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active {
    background: var(--surface-raised);
    color: var(--ink);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 16px;
    text-transform: uppercase;
    font-size: 11px;
  }
  .row {
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .row-label {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .slider-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .slider-line:last-child { margin-bottom: 0; }
  .slider-line label {
    font-size: 12px;
    color: var(--ink-muted);
    width: 72px;
    flex-shrink: 0;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--sat);
    height: 20px;
  }
  input[type="range"].imp { accent-color: var(--imp); }
  .val {
    font-size: 14px;
    font-weight: 500;
    min-width: 20px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .save-btn {
    background: var(--accent);
    color: #14140f;
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled { background: var(--line); color: var(--ink-muted); cursor: default; }
  .status {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item button {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink);
  }
  .empty {
    font-size: 13px;
    color: var(--ink-muted);
    text-align: center;
    padding: 16px 0;
  }
  .priority {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .priority:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Quarterly check-in</p>
  <h1>Wheel of life</h1>
  <p class="sub">Score satisfaction and importance for each area. Entries save on this device and build a trend over time.</p>

  <div class="tabs">
    <div class="tab active" data-tab="checkin">Check-in</div>
    <div class="tab" data-tab="trends">Trends</div>
    <div class="tab" data-tab="history">History</div>
  </div>

  <div class="panel active" id="panel-checkin">
    <div class="card">
      <h2>Score each area</h2>
      <div class="legend">
        <span><span class="dot" style="background: var(--sat);"></span>Satisfaction</span>
        <span><span class="dot" style="background: var(--imp);"></span>Importance</span>
      </div>
      <div id="sliders"></div>
    </div>

    <div class="card">
      <button class="save-btn" id="saveBtn">Save this check-in</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="panel" id="panel-trends">
    <div class="card">
      <h2>Current snapshot</h2>
      <div style="position: relative; width: 100%; height: 300px;">
        <canvas id="wheelChart" role="img" aria-label="Radar chart of satisfaction and importance across eight life areas"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>Biggest gaps right now</h2>
      <div id="priority-list"></div>
    </div>

    <div class="card" id="trendCard" style="display: none;">
      <h2>Average satisfaction over time</h2>
      <div style="position: relative; width: 100%; height: 220px;">
        <canvas id="trendChart" role="img" aria-label="Line chart of average satisfaction score over time"></canvas>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-history">
    <div class="card">
      <h2>Past check-ins</h2>
      <div id="history"></div>
    </div>
  </div>
</div>

<script>
const AREAS = [
  { key: 'health', label: 'Health' },
  { key: 'finance', label: 'Finance' },
  { key: 'relationships', label: 'Relationships' },
  { key: 'work', label: 'Work' },
  { key: 'knowledge', label: 'Knowledge' },
  { key: 'home', label: 'Home and auto' },
  { key: 'hobbies', label: 'Hobbies' },
  { key: 'growth', label: 'Personal growth' },
  { key: 'parenting', label: 'Parenting' }
];

const sat = {}, imp = {};
AREAS.forEach(a => { sat[a.key] = 5; imp[a.key] = 5; });

const slidersDiv = document.getElementById('sliders');
AREAS.forEach(a => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="row-label">${a.label}</div>
    <div class="slider-line">
      <label>Satisfaction</label>
      <input type="range" min="1" max="10" step="1" value="5" id="sat-${a.key}">
      <span class="val" id="sat-out-${a.key}">5</span>
    </div>
    <div class="slider-line">
      <label>Importance</label>
      <input type="range" min="1" max="10" step="1" value="5" id="imp-${a.key}" class="imp">
      <span class="val" id="imp-out-${a.key}">5</span>
    </div>
  `;
  slidersDiv.appendChild(row);
});

let chart, trendChart;

function initChart() {
  const ctx = document.getElementById('wheelChart');
  chart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: AREAS.map(a => a.label),
      datasets: [
        {
          label: 'Satisfaction',
          data: AREAS.map(a => sat[a.key]),
          backgroundColor: 'rgba(111,191,115,0.15)',
          borderColor: '#6fbf73',
          borderWidth: 2,
          pointBackgroundColor: '#6fbf73',
          pointRadius: 3
        },
        {
          label: 'Importance',
          data: AREAS.map(a => imp[a.key]),
          backgroundColor: 'rgba(199,106,46,0.08)',
          borderColor: '#c76a2e',
          borderWidth: 2,
          borderDash: [4, 3],
          pointBackgroundColor: '#c76a2e',
          pointRadius: 3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, backdropColor: 'transparent', color: '#898781', font: { size: 10 } },
          grid: { color: '#e1e0d9' },
          angleLines: { color: '#e1e0d9' },
          pointLabels: { font: { size: 11 }, color: '#52514e' }
        }
      },
      plugins: { legend: { display: false } }
    }
  });
}

function updateChart() {
  chart.data.datasets[0].data = AREAS.map(a => sat[a.key]);
  chart.data.datasets[1].data = AREAS.map(a => imp[a.key]);
  chart.update();
}

function renderPriorityList() {
  const gaps = AREAS.map(a => ({ label: a.label, gap: imp[a.key] - sat[a.key] }))
    .filter(x => x.gap > 0)
    .sort((a, b) => b.gap - a.gap)
    .slice(0, 3);
  const div = document.getElementById('priority-list');
  if (gaps.length === 0) {
    div.innerHTML = '<p class="empty">No gaps yet — adjust the sliders above.</p>';
    return;
  }
  div.innerHTML = gaps.map(g => `
    <div class="priority"><span>${g.label}</span><span style="color: var(--ink-soft);">gap of ${g.gap}</span></div>
  `).join('');
}

AREAS.forEach(a => {
  document.getElementById('sat-' + a.key).addEventListener('input', (e) => {
    sat[a.key] = parseInt(e.target.value, 10);
    document.getElementById('sat-out-' + a.key).textContent = sat[a.key];
    updateChart();
    renderPriorityList();
  });
  document.getElementById('imp-' + a.key).addEventListener('input', (e) => {
    imp[a.key] = parseInt(e.target.value, 10);
    document.getElementById('imp-out-' + a.key).textContent = imp[a.key];
    updateChart();
    renderPriorityList();
  });
});

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

async function loadHistory() {
  const historyDiv = document.getElementById('history');
  try {
    const raw = localStorage.getItem('wheelOfLifeCheckins');
    const entries = raw ? JSON.parse(raw) : [];

    if (entries.length === 0) {
      historyDiv.innerHTML = '<p class="empty">No check-ins saved yet.</p>';
      document.getElementById('trendCard').style.display = 'none';
      return;
    }

    const sorted = entries.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

    historyDiv.innerHTML = sorted.map(e => {
      const avgSat = (Object.values(e.sat).reduce((a, b) => a + b, 0) / AREAS.length).toFixed(1);
      return `<div class="history-item">
        <span>${formatDate(e.date)} — avg satisfaction ${avgSat}</span>
        <button onclick="loadEntry('${e.date}')">Load</button>
      </div>`;
    }).join('');

    if (sorted.length >= 2) {
      document.getElementById('trendCard').style.display = 'block';
      renderTrend(sorted.slice().reverse());
    } else {
      document.getElementById('trendCard').style.display = 'none';
    }
  } catch (err) {
    historyDiv.innerHTML = '<p class="empty">No check-ins saved yet.</p>';
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'trends') updateChart();
}

window.loadEntry = function(date) {
  const raw = localStorage.getItem('wheelOfLifeCheckins');
  const entries = raw ? JSON.parse(raw) : [];
  const entry = entries.find(e => e.date === date);
  if (!entry) return;
  AREAS.forEach(a => {
    sat[a.key] = entry.sat[a.key];
    imp[a.key] = entry.imp[a.key];
    document.getElementById('sat-' + a.key).value = sat[a.key];
    document.getElementById('imp-' + a.key).value = imp[a.key];
    document.getElementById('sat-out-' + a.key).textContent = sat[a.key];
    document.getElementById('imp-out-' + a.key).textContent = imp[a.key];
  });
  updateChart();
  renderPriorityList();
  switchTab('checkin');
  document.getElementById('status').textContent = 'Loaded check-in from ' + formatDate(date);
};

function renderTrend(entries) {
  const labels = entries.map(e => formatDate(e.date));
  const avgSats = entries.map(e => +(Object.values(e.sat).reduce((a, b) => a + b, 0) / AREAS.length).toFixed(1));
  const ctx = document.getElementById('trendChart');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Avg satisfaction',
        data: avgSats,
        borderColor: '#6fbf73',
        backgroundColor: 'rgba(111,191,115,0.08)',
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: '#6fbf73',
        fill: true,
        tension: 0.2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { min: 0, max: 10, ticks: { color: '#898781' }, grid: { color: '#e1e0d9' } },
        x: { ticks: { color: '#898781' }, grid: { display: false } }
      },
      plugins: { legend: { display: false } }
    }
  });
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  try {
    const today = new Date().toISOString().slice(0, 10);
    const entry = { date: today, sat: { ...sat }, imp: { ...imp } };
    const raw = localStorage.getItem('wheelOfLifeCheckins');
    const entries = raw ? JSON.parse(raw) : [];
    const idx = entries.findIndex(e => e.date === today);
    if (idx >= 0) entries[idx] = entry; else entries.push(entry);
    localStorage.setItem('wheelOfLifeCheckins', JSON.stringify(entries));
    status.textContent = 'Saved for ' + formatDate(today) + '.';
    loadHistory();
  } catch (err) {
    status.textContent = 'Save failed. Try again.';
  }
  btn.disabled = false;
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

initChart();
renderPriorityList();
loadHistory();
</script>
</body>
</html>
